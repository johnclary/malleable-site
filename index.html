<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Malleable</title>
    <meta
      name="description"
      content="Consulting for government — geospatial data, transportation systems, digital services"
    />
    <meta name="author" content="John Clary" />
    <link rel="author" href="https://github.com/johnclary" />

    <meta property="og:title" content="Malleable" />
    <meta
      property="og:description"
      content="Consulting for government — geospatial data, transportation systems, digital services"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Malleable" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Malleable" />
    <meta
      name="twitter:description"
      content="Consulting for government — geospatial data, transportation systems, digital services"
    />

    <link rel="icon" href="/assets/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  </head>
  <style>
    html {
      font-family: sans-serif;
      color: #fff;
    }

    body {
      background-color: #028840;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      margin: 0;
      padding: 0 clamp(1.5rem, 8vw, 8rem);
    }

    .content {
      display: flex;
      align-items: center;
      gap: 2.5rem;
    }

    .content img {
      flex-shrink: 0;
      width: 150px;
      height: 150px;
    }

    .text {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 4rem);
      margin: 0;
    }

    p {
      font-size: clamp(1rem, 2vw, 2rem);
      margin: 0;
    }

    a {
      color: #ffcf40;
      text-decoration-color: #ffcf40;
    }

    a:hover,
    a:focus {
      color: #fff;
      text-decoration-color: #fff;
    }

    @media (max-width: 600px) {
      .content {
        flex-direction: column;
        text-align: center;
      }

      .text {
        align-items: center;
      }
    }
  </style>
  <body>
    <div class="content">
      <div>
        <img
          style="height: 100%"
          src="/assets/malleable.svg"
          alt="Malleable company logo - a bicycle sharrow with a city skyline nested below it"
        />
      </div>

      <div class="text">
        <h1>Malleable</h1>
        <p>
          Consulting for government — mobility data, geospatial systems,
          digital services
        </p>
        <p>
          <a href="https://www.linkedin.com/in/john-clary-93469aa0/"
            >Get in touch</a
          >
        </p>
      </div>
    </div>
  </body>
</html>
